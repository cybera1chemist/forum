<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090711">
    <title>查询用户 — 炼金术师论坛</title>
    <link rel="stylesheet" href="../assets/css/forum.css">
    <script src="../assets/js/navigation.js" defer></script>
    <script src="../assets/js/avatar-profile-links.js" defer></script>
    <script src="../assets/js/forum.js" defer></script>
  </head>
  <body data-page="user-search">
    <div class="ambient ambient--home" aria-hidden="true"></div>
    <div id="site-navigation"></div>
    <div class="site-shell">
      <main class="tool-page user-search-page">
        <p class="tool-eyebrow">ADMIN CONSOLE / 02</p>
        <h1>查询用户</h1>

        <form class="user-query-form" data-user-query-form>
          <div class="query-field query-field--full">
            <label for="query-nickname">用户名</label>
            <input id="query-nickname" name="nickname" type="text" autocomplete="off" required>
          </div>
          <fieldset class="query-field query-choice-row">
            <legend>性别</legend>
            <div class="gender-choices">
              <label class="choice-option" for="gender-female">
                <input id="gender-female" name="gender" type="radio" value="female" required>
                <span class="choice-indicator" aria-hidden="true"></span>
                <span>女</span>
              </label>
              <label class="choice-option" for="gender-male">
                <input id="gender-male" name="gender" type="radio" value="male">
                <span class="choice-indicator" aria-hidden="true"></span>
                <span>男</span>
              </label>
              <label class="choice-option" for="gender-other">
                <input id="gender-other" name="gender" type="radio" value="other">
                <span class="choice-indicator" aria-hidden="true"></span>
                <span>其他</span>
              </label>
            </div>
          </fieldset>
          <div class="query-field query-field--full">
            <label for="query-home">家乡省份</label>
            <div class="custom-select">
              <select id="query-home" name="home" required>
                <option value="">请选择省份</option>
              </select>
            </div>
          </div>
          <fieldset class="query-field query-field--full profession-field">
            <legend>职业</legend>
            <div id="profession-options" class="profession-categories"></div>
          </fieldset>
          <p id="user-query-message" class="form-message" role="status" aria-live="polite"></p>
          <button class="tool-button" type="submit" disabled>提交查询</button>
        </form>

        <section id="user-query-result" class="user-query-result" aria-live="polite" hidden></section>
      </main>

      <footer class="site-footer">
        <a class="footer-brand" href="../index.html">炼金术师论坛 <span>© 2026</span></a>
      </footer>
    </div>
    <div class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
