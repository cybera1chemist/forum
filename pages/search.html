<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090711">
    <title>搜索帖子 — 炼金术师论坛</title>
    <link rel="stylesheet" href="../assets/css/forum.css">
    <script src="../assets/js/navigation.js" defer></script>
    <script src="../assets/js/forum.js" defer></script>
  </head>
  <body data-page="search">
    <div class="ambient ambient--home" aria-hidden="true"></div>
    <div id="site-navigation"></div>
    <div class="site-shell">
      <main class="search-page">
        <h1>搜索帖子</h1>
        <form class="search-box search-page-form" data-search-form>
          <span class="search-icon" aria-hidden="true"></span>
          <label class="visually-hidden" for="search-page-query">搜索帖子关键词</label>
          <input id="search-page-query" type="search" placeholder="输入帖子关键词…" autocomplete="off">
          <button type="submit">搜索</button>
        </form>
        <p id="search-summary" class="search-summary" aria-live="polite">正在准备搜索结果…</p>
        <div id="search-results" class="post-list" aria-live="polite">
          <div class="loading-row"><span class="loader"></span>正在检索社区信号…</div>
        </div>
      </main>

      <footer class="site-footer">
        <a class="footer-brand" href="../index.html">炼金术师论坛 <span>© 2026</span></a>
      </footer>
    </div>
    <div class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
